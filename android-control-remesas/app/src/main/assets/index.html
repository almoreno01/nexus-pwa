<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Remesas</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#67728a;--line:#e3e8f2;--primary:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top)}button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:24px 16px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h1{font-size:25px;margin:0}.brand p{margin:5px 0 0;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff}.ghost{background:#eef2ff;color:#28426f}.danger{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 4px 16px rgba(21,35,64,.05)}.doc{cursor:pointer}.doc h3{margin:0 0 8px}.url{font-size:12px;color:var(--muted);word-break:break-all}.badge{display:inline-block;background:#e8f0ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;margin-top:12px}.row-actions{display:flex;justify-content:space-between;align-items:start;gap:10px}.back{cursor:pointer;font-weight:700;margin-bottom:18px;display:inline-block}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d5dcea;border-radius:9px;background:#fff}.notice{padding:11px 13px;border-radius:9px;margin:12px 0;font-size:13px;background:#eff6ff;color:#1e40af}.modal,.result-modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}.modal-card,.result-modal-card{width:min(920px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modal-card{width:min(540px,100%)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.result-head{display:flex;justify-content:space-between;gap:16px}.result-head h2{margin:0}.close-x{border:0;background:#eef2f7;border-radius:9px;width:38px;height:38px;font-size:22px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .value{font-size:27px;font-weight:800;margin-top:5px}.table-wrap{overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:640px;background:#fff}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafc;color:#536078}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.result-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.btn.primary{width:100%}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
const SHEETS=["USD","CUP","RUDY","YAMI","YOEL","OSMEL","ALEJANDRO","CHARLY","YAN CARLOS","ALVARO","ALIET","MALENA","KENNY","BABY","ALEX","ELY","MARBELIS","MANUEL","EDDY","ANELYS","Copia de ANELYS","LEO","FELIX","Copia de JAVIER-USD"];
const DEFAULT_URL="https://docs.google.com/spreadsheets/d/1ocNSfll-I0JJLGCq8e-6_7FNyD0DhPDeDEElv7okgaw/edit?gid=1474306275#gid=1474306275";
let callbacks={};
window.__nativeFetchResolve=function(id,status,body,error){const cb=callbacks[id];if(!cb)return;delete callbacks[id];if(error)cb.reject(new Error(error));else cb.resolve({status,body});};
function nativeFetch(url){if(window.NativeApp&&NativeApp.fetchUrl){return new Promise((resolve,reject)=>{const id="f"+Date.now()+Math.random();callbacks[id]={resolve,reject};NativeApp.fetchUrl(url,id);});}return fetch(url).then(async r=>({status:r.status,body:await r.text()}));}
function loadDocs(){try{if(window.NativeApp&&NativeApp.getDocuments){const s=NativeApp.getDocuments();if(s)return JSON.parse(s);}const s=localStorage.getItem("control_remesas_docs");if(s)return JSON.parse(s);}catch(e){}return [{id:"demo",name:"Plantilla de trabajadores",url:DEFAULT_URL}];}
let docs=loadDocs();
function saveDocs(){const s=JSON.stringify(docs);try{if(window.NativeApp&&NativeApp.setDocuments)NativeApp.setDocuments(s);else localStorage.setItem("control_remesas_docs",s);}catch(e){}}
let state={screen:"home",current:null,modal:false,rows:null};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function extractId(url){const m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);return m?m[1]:"";}
function money(n){return Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2});}
function parseAmount(v){let s=String(v??"").trim().replace(/\s/g,"").replace(/[^0-9,.-]/g,"");if(!s)return 0;if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");else if(s.includes(",")){const p=s.split(",");s=(p.length===2&&p[1].length<=2)?p[0]+"."+p[1]:s.replace(/,/g,"");}const n=Number(s);return Number.isFinite(n)?n:0;}
function parseDate(v){const m=String(v??"").trim().match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(!m)return null;return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));}
function parseCSV(text){const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')q=false;else cell+=c;}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell="";}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell="";}else cell+=c;}}if(cell.length||row.length){row.push(cell);rows.push(row);}return rows;}
function homeHtml(){return '<div class="shell"><div class="topbar"><div class="brand"><h1>Control de remesas</h1><p>Documentos guardados solo en este dispositivo.</p></div><button class="btn primary" id="addBtn">+ Agregar documento</button></div><div class="grid">'+docs.map(d=>'<div class="card doc" data-open="'+esc(d.id)+'"><div class="row-actions"><div><h3>'+esc(d.name)+'</h3><div class="url">'+esc(d.url)+'</div></div><button class="btn danger" data-del="'+esc(d.id)+'">×</button></div><span class="badge">Google Sheets</span></div>').join('')+'</div>'+(state.modal?modalHtml():'')+'</div>';}
function modalHtml(){return '<div class="modal" id="modalBg"><div class="modal-card"><h2>Agregar documento</h2><div class="field"><label>Nombre</label><input id="docName" placeholder="Ej. Trabajadores Agosto 2026"></div><div class="field" style="margin-top:12px"><label>Enlace de Google Sheets</label><input id="docUrl" placeholder="https://docs.google.com/spreadsheets/d/..."></div><div class="notice">El documento se guarda únicamente en esta app de este dispositivo.</div><div class="modal-actions"><button class="btn ghost" id="cancelBtn">Cancelar</button><button class="btn primary" id="saveBtn">Guardar</button></div></div></div>';}
function detailHtml(){const d=state.current;if(!d)return homeHtml();let result='';if(state.rows){const r=state.rows,cl=r.currency==='USA'?'USD':r.currency;const lines=r.items.length?r.items.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.currency==='USA'?'USD':x.currency)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.name)+'</td></tr>').join(''):'<tr><td colspan="4">Sin resultados.</td></tr>';result='<div class="result-modal" id="resultBg"><div class="result-modal-card"><div class="result-head"><div><h2>Resultado</h2><div class="url">'+esc(r.sheet)+' · '+esc(r.from)+' → '+esc(r.to)+'</div></div><button class="close-x" id="closeResult">×</button></div><div class="result-grid"><div class="card metric"><div class="label">OPERACIONES</div><div class="value">'+r.count+'</div></div><div class="card metric"><div class="label">TOTAL COLUMNA C</div><div class="value">'+money(r.total)+'</div></div><div class="card metric"><div class="label">MONEDA</div><div class="value">'+esc(cl)+'</div></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Moneda</th><th>Monto (C)</th><th>Nombre</th></tr></thead><tbody>'+lines+'</tbody></table></div></div></div>';}
return '<div class="shell"><div class="back" id="backBtn">← Volver a documentos</div><div class="topbar"><div class="brand"><h1>'+esc(d.name)+'</h1><p>'+esc(d.url)+'</p></div></div><div class="card"><div class="filters"><div class="field wide"><label>Hoja / trabajador</label><select id="sheet">'+SHEETS.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></div><div class="field"><label>Fecha inicial</label><input id="from" type="date"></div><div class="field"><label>Fecha final</label><input id="to" type="date"></div><div class="field"><label>Moneda</label><select id="currency"><option value="USA" selected>USD</option><option value="EUR">EUR</option><option value="MXC">MXC</option><option value="CAD">CAD</option><option value="REAL">REAL</option></select></div><button class="btn primary" id="filterBtn">Filtrar</button></div></div>'+result+'</div>';}
function render(){document.getElementById('app').innerHTML=state.screen==='home'?homeHtml():detailHtml();}
async function runFilter(){const sheet=document.getElementById('sheet').value,from=document.getElementById('from').value,to=document.getElementById('to').value,currency=document.getElementById('currency').value;if(!from||!to){alert('Selecciona fecha inicial y final.');return;}const f=new Date(from+'T00:00:00'),t=new Date(to+'T23:59:59');if(f>t){alert('La fecha inicial no puede ser posterior a la final.');return;}state.rows=null;const id=extractId(state.current.url);if(!id){alert('Enlace no válido.');return;}const btn=document.getElementById('filterBtn');try{btn.disabled=true;btn.textContent='Consultando...';const url='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id)+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(sheet);const r=await nativeFetch(url);if(r.status<200||r.status>=400)throw new Error('Google respondió '+r.status);if(/<!doctype html|<html|sign in|iniciar sesi[oó]n/i.test(r.body))throw new Error('El Sheet debe estar compartido como: Cualquier persona con el enlace → Lector.');const rows=parseCSV(r.body);let inherited=null;const items=[];rows.forEach((row,i)=>{const d=parseDate(row[0]);if(d)inherited=row[0];if(!inherited)return;const rd=parseDate(inherited);if(!rd||rd<f||rd>t)return;const curr=String(row[1]||'').trim().toUpperCase();if(curr!==currency)return;const raw=row[2],name=String(row[3]||'').trim();if((raw==null||String(raw).trim()==='')&&!name)return;items.push({row:i+1,date:inherited,currency:curr,amount:parseAmount(raw),name});});const total=items.reduce((s,x)=>s+x.amount,0);state.rows={sheet,currency,from,to,count:items.length,total:Math.round((total+Number.EPSILON)*100)/100,items};render();}catch(e){alert('No se pudo consultar el Spreadsheet. '+e.message);}finally{const b=document.getElementById('filterBtn');if(b){b.disabled=false;b.textContent='Filtrar';}}}
document.addEventListener('click',e=>{const t=e.target;if(t.id==='addBtn'){state.modal=true;render();return;}if(t.id==='cancelBtn'||(t.id==='modalBg'&&e.target===t)){state.modal=false;render();return;}if(t.id==='saveBtn'){const name=document.getElementById('docName').value.trim(),url=document.getElementById('docUrl').value.trim();if(!name||!extractId(url)){alert('Escribe un nombre y un enlace válido.');return;}docs.push({id:'d'+Date.now(),name,url});saveDocs();state.modal=false;render();return;}if(t.id==='backBtn'){state.screen='home';state.current=null;state.rows=null;render();return;}if(t.id==='filterBtn'){runFilter();return;}if(t.id==='closeResult'||(t.id==='resultBg'&&e.target===t)){state.rows=null;render();return;}const del=t.closest('[data-del]');if(del){e.stopPropagation();docs=docs.filter(d=>d.id!==del.dataset.del);saveDocs();render();return;}const card=t.closest('[data-open]');if(card){state.current=docs.find(d=>d.id===card.dataset.open);state.screen='detail';state.rows=null;render();}});
render();
})();
</script></body></html>
