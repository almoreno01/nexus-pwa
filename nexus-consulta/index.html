<title>Nexus Consulta</title>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        const scope=new URL(reg.scope).pathname;
        if(scope==='/nexus-pwa/' || scope==='/nexus-pwa'){await reg.unregister();}
      }
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('nexus-pwa-')).map(k=>caches.delete(k)));
    }
  }catch(e){}
})();
</script>
