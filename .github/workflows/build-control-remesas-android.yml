name: Build Nexus Stats APK

on:
  push:
    branches:
      - main
      - agent/nexus-stats-android
    paths:
      - 'android-control-remesas/**'
      - '.github/workflows/build-control-remesas-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare launcher icon
        run: |
          mkdir -p android-control-remesas/app/src/main/res/drawable
          base64 --decode android-control-remesas/nexus-stats-icon.b64 > android-control-remesas/app/src/main/res/drawable/nexus_stats_icon.png

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-control-remesas
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-control-remesas/app/build/outputs/apk/debug/app-debug.apk android-control-remesas/app/build/outputs/apk/debug/Nexus-Stats-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-stats-apk
          path: android-control-remesas/app/build/outputs/apk/debug/Nexus-Stats-v2.0.apk
          if-no-files-found: error
