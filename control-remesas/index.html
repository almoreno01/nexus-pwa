<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Remesas</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#67728a;--line:#e3e8f2;--primary:#2563eb;--primary2:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 18px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.brand h1{font-size:26px;margin:0}.brand p{margin:5px 0 0;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff}.ghost{background:#eef2ff;color:#28426f}.danger{background:#fee2e2;color:#991b1b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(21,35,64,.05)}
.doc{cursor:pointer}.doc h3{margin:0 0 8px}.url{font-size:12px;color:var(--muted);word-break:break-all}.badge{display:inline-block;background:#e8f0ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;margin-top:12px}
.back{cursor:pointer;font-weight:700;margin-bottom:18px;display:inline-block}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d5dcea;border-radius:9px;background:#fff}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .value{font-size:28px;font-weight:800;margin-top:5px}
.table-wrap{overflow:auto;margin-top:16px;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px;background:#fff}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafc;color:#536078}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;padding:18px}.modal-card{width:min(540px,100%);background:#fff;border-radius:16px;padding:22px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.result-modal{position:fixed;inset:0;background:rgba(15,23,42,.52);display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.result-modal-card{width:min(920px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 60px rgba(15,23,42,.25)}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:10px}.result-head h2{margin:0}.close-x{border:0;background:#eef2f7;border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:22px;line-height:1}
.notice{padding:11px 13px;border-radius:9px;margin:12px 0;font-size:13px}.warn{background:#fff7ed;color:#9a3412}.info{background:#eff6ff;color:#1e40af}.row-actions{display:flex;justify-content:space-between;align-items:start;gap:10px}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.result-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app"><div style="padding:30px;font-family:Arial">Cargando aplicación...</div></div>
<script>
(function(){
const DEMO_SHEETS=["USD","CUP","RUDY","YAMI","YOEL","OSMEL","ALEJANDRO","CHARLY","YAN CARLOS","ALVARO","ALIET","MALENA","KENNY","BABY","ALEX","ELY","MARBELIS","MANUEL","EDDY","ANELYS","Copia de ANELYS","LEO","FELIX","Copia de JAVIER-USD"];
const DEFAULT_URL="https://docs.google.com/spreadsheets/d/1ocNSfll-I0JJLGCq8e-6_7FNyD0DhPDeDEElv7okgaw/edit?gid=1474306275#gid=1474306275";
let docs;try{docs=JSON.parse(localStorage.getItem("control_remesas_docs_v2")||"null");}catch(e){docs=null;}if(!Array.isArray(docs)){docs=[{id:"demo",name:"Plantilla de trabajadores",url:DEFAULT_URL}];}
let state={screen:"home",current:null,modal:false,rows:null};
function save(){try{localStorage.setItem("control_remesas_docs_v2",JSON.stringify(docs));}catch(e){}}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){return Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2});}
function parseAmount(v){if(typeof v==="number")return Number.isFinite(v)?v:0;let s=String(v==null?"":v).trim().replace(/\s/g,"");if(!s)return 0;s=s.replace(/[^0-9,.-]/g,"");if(s.includes(",")&&s.includes(".")){if(s.lastIndexOf(",")>s.lastIndexOf("."))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");}else if(s.includes(",")){const p=s.split(",");s=(p.length===2&&p[1].length<=2)?p[0].replace(/\./g,"")+"."+p[1]:s.replace(/,/g,"");}const n=Number(s);return Number.isFinite(n)?n:0;}
function parseDateDMY(v){if(!v)return null;const p=String(v).trim().split("/");if(p.length!==3)return null;const d=Number(p[0]),m=Number(p[1]),y=Number(p[2]);if(!d||!m||!y)return null;return new Date(y,m-1,d);}
function extractId(url){const m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);return m?m[1]:"";}
function render(){const app=document.getElementById("app");if(!app)return;app.innerHTML=state.screen==="home"?homeHtml():detailHtml();}
function homeHtml(){let cards="";if(docs.length){cards='<div class="grid">'+docs.map(function(d){return '<div class="card doc" data-open="'+esc(d.id)+'"><div class="row-actions"><div><h3>'+esc(d.name)+'</h3><div class="url">'+esc(d.url)+'</div></div><button class="btn danger" data-del="'+esc(d.id)+'">×</button></div><span class="badge">Google Sheets</span></div>';}).join("")+'</div>';}else{cards='<div class="card">No hay documentos.</div>';}return '<div class="shell"><div class="topbar"><div class="brand"><h1>Control de remesas</h1><p>Consulta por hoja, período y moneda.</p></div><button class="btn primary" id="addBtn">+ Agregar documento</button></div>'+cards+(state.modal?modalHtml():"")+'</div>';}
function modalHtml(){return '<div class="modal" id="modalBg"><div class="modal-card"><h2>Agregar documento</h2><div class="field"><label>Nombre</label><input id="docName" placeholder="Ej. Trabajadores Julio 2026"></div><div class="field" style="margin-top:12px"><label>Enlace de Google Sheets</label><input id="docUrl" placeholder="https://docs.google.com/spreadsheets/d/..."></div><div class="notice info">Los documentos se guardan en este navegador.</div><div class="modal-actions"><button class="btn ghost" id="cancelBtn">Cancelar</button><button class="btn primary" id="saveBtn">Guardar</button></div></div></div>';}
function detailHtml(){const d=state.current;if(!d){state.screen="home";return homeHtml();}let resultHtml="";if(state.rows){const r=state.rows;const currencyLabel=r.currency==="USA"?"USD":r.currency;const lines=r.items.length?r.items.map(function(x){const xl=x.currency==="USA"?"USD":x.currency;return '<tr><td>'+esc(x.date)+'</td><td>'+esc(xl)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.name)+'</td></tr>';}).join(""):'<tr><td colspan="4">Sin resultados.</td></tr>';resultHtml='<div class="result-modal" id="resultModalBg"><div class="result-modal-card"><div class="result-head"><div><h2>Resultado del filtro</h2><div class="url">'+esc(r.sheet)+' · '+esc(r.from)+' → '+esc(r.to)+'</div></div><button class="close-x" id="closeResultBtn">×</button></div><div class="result-grid"><div class="card metric"><div class="label">OPERACIONES</div><div class="value">'+r.count+'</div></div><div class="card metric"><div class="label">TOTAL COLUMNA C</div><div class="value">'+money(r.total)+'</div></div><div class="card metric"><div class="label">MONEDA</div><div class="value">'+esc(currencyLabel)+'</div></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Moneda</th><th>Monto (C)</th><th>Nombre</th></tr></thead><tbody>'+lines+'</tbody></table></div></div></div>';}return '<div class="shell"><div class="back" id="backBtn">← Volver a documentos</div><div class="topbar"><div class="brand"><h1>'+esc(d.name)+'</h1><p>'+esc(d.url)+'</p></div></div><div class="card"><div class="notice info"><b>Consulta directa.</b> Los datos se leen del Google Sheet seleccionado.</div><div class="filters"><div class="field wide"><label>Hoja / trabajador</label><select id="sheet">'+DEMO_SHEETS.map(function(s){return '<option>'+esc(s)+'</option>';}).join("")+'</select></div><div class="field"><label>Fecha inicial</label><input id="from" type="date" value="2026-07-01"></div><div class="field"><label>Fecha final</label><input id="to" type="date" value="2026-07-04"></div><div class="field"><label>Moneda</label><select id="currency"><option value="USA" selected>USD</option><option value="EUR">EUR</option><option value="MXC">MXC</option><option value="CAD">CAD</option><option value="REAL">REAL</option></select></div><button class="btn primary" id="filterBtn">Filtrar</button></div></div>'+resultHtml+'</div>';}
function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else{if(c==='"')quoted=true;else if(c===','){row.push(cell);cell="";}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell="";}else cell+=c;}}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);}return rows;}
async function filterDemo(){const from=document.getElementById("from").value;const to=document.getElementById("to").value;const currency=document.getElementById("currency").value;const sheet=document.getElementById("sheet").value;state.rows=null;if(!from||!to||!currency){alert("Completa los filtros.");return;}const f=new Date(from+"T00:00:00"),t=new Date(to+"T23:59:59");if(f>t){alert("La fecha inicial no puede ser posterior a la fecha final.");return;}const spreadsheetId=extractId(state.current.url);if(!spreadsheetId){alert("El enlace de Google Sheets no es válido.");return;}const btn=document.getElementById("filterBtn");try{if(btn){btn.disabled=true;btn.textContent="Consultando...";}const csvUrl="https://docs.google.com/spreadsheets/d/"+encodeURIComponent(spreadsheetId)+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(sheet);const response=await fetch(csvUrl,{method:"GET",cache:"no-store"});if(!response.ok)throw new Error("Google respondió con error "+response.status+".");const text=await response.text();if(/<!doctype html|<html/i.test(text)||/sign in|iniciar sesi[oó]n/i.test(text))throw new Error("Google no permite leer este Sheet. En Compartir, selecciona: Cualquier persona con el enlace → Lector.");const rows=parseCSV(text);let inheritedDate=null;const items=[];rows.forEach(function(row,index){const detected=parseDateDMY(row[0]);if(detected)inheritedDate=row[0];if(!inheritedDate)return;const rowCurrency=String(row[1]||"").trim().toUpperCase();const rawAmount=row[2];const name=String(row[3]||"").trim();if(!rowCurrency)return;if((rawAmount==null||String(rawAmount).trim()==="")&&!name)return;const d=parseDateDMY(inheritedDate);if(!d||d<f||d>t)return;if(rowCurrency!==String(currency).toUpperCase())return;items.push({row:index+1,date:inheritedDate,currency:rowCurrency,amount:parseAmount(rawAmount),name:name});});const total=items.reduce(function(sum,x){return sum+parseAmount(x.amount);},0);state.rows={sheet:sheet,currency:currency,from:from,to:to,count:items.length,total:Math.round((total+Number.EPSILON)*100)/100,items:items};render();}catch(e){alert("No se pudo consultar el Spreadsheet. "+(e&&e.message?e.message:e));}finally{const b=document.getElementById("filterBtn");if(b){b.disabled=false;b.textContent="Filtrar";}}}
document.addEventListener("click",function(e){const t=e.target;if(t.id==="addBtn"){state.modal=true;render();return;}if(t.id==="cancelBtn"||t.id==="modalBg"){if(t.id==="modalBg"&&e.target!==t)return;state.modal=false;render();return;}if(t.id==="saveBtn"){const name=document.getElementById("docName").value.trim(),url=document.getElementById("docUrl").value.trim();if(!name||!extractId(url)){alert("Escribe un nombre y un enlace válido de Google Sheets.");return;}docs.push({id:"d"+Date.now(),name:name,url:url});save();state.modal=false;render();return;}if(t.id==="backBtn"){state.screen="home";state.current=null;state.rows=null;render();return;}if(t.id==="filterBtn"){filterDemo();return;}if(t.id==="closeResultBtn"){state.rows=null;render();return;}if(t.id==="resultModalBg"&&e.target===t){state.rows=null;render();return;}const del=t.closest("[data-del]");if(del){e.stopPropagation();docs=docs.filter(function(d){return d.id!==del.getAttribute("data-del");});save();render();return;}const card=t.closest("[data-open]");if(card){const id=card.getAttribute("data-open");state.current=docs.find(function(d){return d.id===id;})||null;state.screen="detail";state.rows=null;render();return;}});
render();
})();
</script>
</body>
</html>
