<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Estadísticas Nexus</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e7ebf2;--primary:#315efb;--primary2:#2447c8;--navy:#0b1220;--shadow:0 18px 50px rgba(15,23,42,.08);--soft:0 8px 28px rgba(15,23,42,.06)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{touch-action:manipulation}.app-shell{min-height:100vh}.hero{background:linear-gradient(135deg,#09111f 0%,#111e36 68%,#183b8c 145%);color:#fff;padding:26px 20px 74px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;right:-120px;top:-150px;background:rgba(89,130,255,.18);filter:blur(2px)}.hero-inner{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:45px;height:45px;border-radius:14px;background:linear-gradient(145deg,#6c8cff,#315efb);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 10px 30px rgba(49,94,251,.35)}.brand-copy h1{margin:0;font-size:25px;letter-spacing:-.5px}.brand-copy p{margin:4px 0 0;color:#b9c4d8;font-size:13px}.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:750;transition:.18s ease}.btn:hover{transform:translateY(-1px)}.btn-primary{background:#fff;color:#10234b;box-shadow:0 8px 24px rgba(0,0,0,.13)}.btn-blue{background:var(--primary);color:#fff}.btn-blue:hover{background:var(--primary2)}.btn-soft{background:#eef2ff;color:#2848b7}.btn-icon{width:37px;height:37px;border:0;border-radius:11px;background:#f1f4f8;color:#64748b;cursor:pointer;font-size:18px}.main{max-width:1160px;margin:-45px auto 0;padding:0 20px 56px;position:relative;z-index:3}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 18px}.section-title{font-size:18px;font-weight:800;margin:0}.section-sub{font-size:12px;color:var(--muted);margin-top:4px}.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}.doc-card{background:rgba(255,255,255,.97);border:1px solid rgba(226,232,240,.9);border-radius:20px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:.2s ease;min-height:222px}.doc-card:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(15,23,42,.11)}.doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.doc-title-wrap{min-width:0}.doc-title{margin:0;font-size:18px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc-kicker{display:flex;align-items:center;gap:7px;margin-top:6px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #dcfce7}.currency-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.currency-box{background:var(--panel2);border:1px solid #edf0f5;border-radius:13px;padding:10px 11px}.currency-box.wide{grid-column:1/-1}.currency-label{font-size:10px;color:#7a879b;font-weight:800;letter-spacing:.7px}.currency-value{margin-top:3px;font-size:17px;font-weight:850;letter-spacing:-.25px}.currency-value.loading{color:#a0aabd;font-size:13px;font-weight:650}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#8a96aa;font-size:11px}.empty{background:rgba(255,255,255,.98);border:1px solid #e8edf4;border-radius:24px;box-shadow:var(--shadow);padding:48px 24px;text-align:center}.empty-icon{width:68px;height:68px;border-radius:22px;margin:0 auto 17px;background:linear-gradient(145deg,#eef2ff,#e0e7ff);display:grid;place-items:center;font-size:28px;color:#315efb}.empty h2{font-size:20px;margin:0 0 7px}.empty p{margin:0 auto 20px;color:var(--muted);font-size:14px;max-width:430px;line-height:1.5}.modal-bg,.result-bg{position:fixed;inset:0;background:rgba(6,12,24,.58);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modal-card{width:min(520px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.24)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head h2{margin:0;font-size:20px}.field{margin-top:14px}.field label{display:block;color:#5f6c80;font-size:11px;font-weight:800;margin-bottom:7px;letter-spacing:.3px;text-transform:uppercase}.field input,.field select{width:100%;height:44px;border:1px solid #dfe5ee;border-radius:11px;padding:0 12px;background:#fff;color:#111827;outline:none}.field input:focus,.field select:focus{border-color:#8aa4ff;box-shadow:0 0 0 3px rgba(49,94,251,.1)}.note{margin-top:14px;background:#f5f7ff;border:1px solid #e4e9ff;color:#4f5f89;padding:11px 12px;border-radius:11px;font-size:12px;line-height:1.45}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.detail-hero{background:linear-gradient(135deg,#09111f,#132447);color:#fff;padding:24px 20px 54px}.detail-inner{max-width:1160px;margin:auto}.back{display:inline-flex;align-items:center;gap:7px;color:#cad4e6;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:18px}.detail-title{display:flex;align-items:center;gap:12px}.detail-title h1{margin:0;font-size:25px}.detail-title p{margin:5px 0 0;color:#aab8cf;font-size:12px}.filters-card{background:#fff;border:1px solid #e7ebf2;border-radius:20px;box-shadow:var(--shadow);padding:18px}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr .8fr auto;gap:12px;align-items:end}.result-card{width:min(930px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 26px 85px rgba(0,0,0,.28)}.result-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.result-head h2{margin:0;font-size:21px}.result-sub{margin-top:5px;color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{background:#f8fafc;border:1px solid #edf1f6;border-radius:14px;padding:14px}.metric span{font-size:10px;color:#7c8797;font-weight:800;letter-spacing:.6px}.metric strong{display:block;font-size:24px;margin-top:5px}.table-wrap{overflow:auto;margin-top:16px;border:1px solid #e7ebf2;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 12px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}th{background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.5px}.status-error{color:#b45309}.status-ok{color:#64748b}@media(max-width:800px){.hero{padding-bottom:68px}.hero-inner{align-items:flex-start}.brand-copy h1{font-size:22px}.main{padding-left:14px;padding-right:14px}.docs-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.filter-action{grid-column:1/-1}.metrics{grid-template-columns:1fr}.detail-hero{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const STORAGE_KEY="estadisticas_nexus_docs_v1";
const ALL_SHEETS=["USD","CUP","RUDY","YAMI","YOEL","OSMEL","ALEJANDRO","CHARLY","YAN CARLOS","ALVARO","ALIET","MALENA","KENNY","BABY","ALEX","ELY","MARBELIS","MANUEL","EDDY","ANELYS","Copia de ANELYS","LEO","FELIX","Copia de JAVIER-USD"];
const WORKER_SHEETS=ALL_SHEETS.filter(s=>s!=="USD"&&s!=="CUP");
const CURRENCIES=[["USA","USD"],["EUR","EUR"],["MXC","MXC"],["CAD","CAD"],["REAL","REAL"]];
let docs=[];try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(Array.isArray(saved))docs=saved;}catch(e){}
let state={screen:"home",current:null,modal:false,rows:null,summary:{},loading:{}};
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(docs));}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(n){return Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:2});}
function extractId(url){const m=String(url||"").match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);return m?m[1]:"";}
function parseAmount(v){if(typeof v==="number")return Number.isFinite(v)?v:0;let s=String(v??"").trim().replace(/\s/g,"").replace(/[^0-9,.-]/g,"");if(!s)return 0;if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");else if(s.includes(",")){const p=s.split(",");s=(p.length===2&&p[1].length<=2)?p[0].replace(/\./g,"")+"."+p[1]:s.replace(/,/g,"");}const n=Number(s);return Number.isFinite(n)?n:0;}
function parseDateDMY(v){const p=String(v||"").trim().split("/");if(p.length!==3)return null;const d=+p[0],m=+p[1],y=+p[2];if(!d||!m||!y)return null;const dt=new Date(y,m-1,d);return Number.isNaN(dt.getTime())?null:dt;}
function parseCSV(text){const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')q=false;else cell+=c;}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell="";}else if(c==='\n'){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell="";}else cell+=c;}}if(cell.length||row.length){row.push(cell.replace(/\r$/,""));rows.push(row);}return rows;}
async function fetchSheetRows(doc,sheet){const id=extractId(doc.url);if(!id)throw new Error("Enlace no válido");const url="https://docs.google.com/spreadsheets/d/"+encodeURIComponent(id)+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(sheet);const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("Google respondió "+r.status);const text=await r.text();if(/<!doctype html|<html/i.test(text)||/sign in|iniciar sesi[oó]n/i.test(text))throw new Error("El documento no tiene acceso por enlace");return parseCSV(text);}
function render(){document.getElementById("app").innerHTML=state.screen==="home"?homeHtml():detailHtml();}
function currencyHtml(doc){const summary=state.summary[doc.id],loading=state.loading[doc.id];return CURRENCIES.map(([code,label],i)=>{const value=summary?.totals?.[code];const cls=i===4?"currency-box wide":"currency-box";return '<div class="'+cls+'"><div class="currency-label">'+label+'</div><div class="currency-value'+(loading?' loading':'')+'">'+(loading?'Calculando…':summary?.error?'—':money(value||0))+'</div></div>';}).join("");}
function homeHtml(){const cards=docs.length?'<div class="docs-grid">'+docs.map(doc=>{const summary=state.summary[doc.id];return '<article class="doc-card" data-open="'+esc(doc.id)+'"><div class="doc-top"><div class="doc-title-wrap"><h3 class="doc-title">'+esc(doc.name)+'</h3><div class="doc-kicker"><span class="dot"></span><span>Resumen mensual · todas las hojas</span></div></div><button class="btn-icon" title="Eliminar" data-del="'+esc(doc.id)+'">×</button></div><div class="currency-grid">'+currencyHtml(doc)+'</div><div class="card-foot"><span class="'+(summary?.error?'status-error':'status-ok')+'">'+(state.loading[doc.id]?'Actualizando totales…':summary?.error?'No se pudo leer el documento':'Totales del documento')+'</span><span>›</span></div></article>';}).join("")+'</div>':'<div class="empty"><div class="empty-icon">∑</div><h2>Aún no hay documentos</h2><p>Agrega tu primer Google Spreadsheet para comenzar a consultar estadísticas y ver los acumulados mensuales por moneda.</p><button class="btn btn-blue" id="emptyAddBtn">Agregar documento</button></div>';return '<div class="app-shell"><header class="hero"><div class="hero-inner"><div class="brand"><div class="brand-mark">N</div><div class="brand-copy"><h1>Estadísticas Nexus</h1><p>Resumen y consulta de operaciones</p></div></div><button class="btn btn-primary" id="addBtn">+ Agregar documento</button></div></header><main class="main"><div class="section-head"><div><h2 class="section-title">Documentos</h2><div class="section-sub">'+docs.length+' '+(docs.length===1?'documento':'documentos')+' en este dispositivo</div></div></div>'+cards+'</main>'+(state.modal?modalHtml():'')+'</div>';}
function modalHtml(){return '<div class="modal-bg" id="modalBg"><div class="modal-card"><div class="modal-head"><h2>Agregar documento</h2><button class="btn-icon" id="cancelBtn">×</button></div><div class="field"><label>Nombre</label><input id="docName" placeholder="Ej. Trabajadores Julio 2026"></div><div class="field"><label>Enlace de Google Sheets</label><input id="docUrl" placeholder="https://docs.google.com/spreadsheets/d/..."></div><div class="note">El documento se guardará solamente en este dispositivo. Para poder consultarlo desde la PWA, el Spreadsheet debe permitir lectura mediante enlace.</div><div class="modal-actions"><button class="btn btn-soft" id="cancelBtn2">Cancelar</button><button class="btn btn-blue" id="saveBtn">Guardar</button></div></div></div>';}
function detailHtml(){const d=state.current;if(!d){state.screen="home";return homeHtml();}let result="";if(state.rows){const r=state.rows,label=r.currency==="USA"?"USD":r.currency;const trs=r.items.length?r.items.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.currency==="USA"?'USD':x.currency)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.name)+'</td></tr>').join(""):'<tr><td colspan="4">Sin resultados.</td></tr>';result='<div class="result-bg" id="resultBg"><div class="result-card"><div class="result-head"><div><h2>Resultado del filtro</h2><div class="result-sub">'+esc(r.sheet)+' · '+esc(r.from)+' → '+esc(r.to)+'</div></div><button class="btn-icon" id="closeResult">×</button></div><div class="metrics"><div class="metric"><span>OPERACIONES</span><strong>'+r.count+'</strong></div><div class="metric"><span>TOTAL COLUMNA C</span><strong>'+money(r.total)+'</strong></div><div class="metric"><span>MONEDA</span><strong>'+esc(label)+'</strong></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Moneda</th><th>Monto (C)</th><th>Nombre</th></tr></thead><tbody>'+trs+'</tbody></table></div></div></div>';}return '<div class="app-shell"><header class="detail-hero"><div class="detail-inner"><div class="back" id="backBtn">← Volver a documentos</div><div class="detail-title"><div class="brand-mark">N</div><div><h1>'+esc(d.name)+'</h1><p>Consulta detallada del documento</p></div></div></div></header><main class="main"><div class="filters-card"><div class="filters"><div class="field wide"><label>Hoja / trabajador</label><select id="sheet">'+ALL_SHEETS.map(s=>'<option>'+esc(s)+'</option>').join("")+'</select></div><div class="field"><label>Fecha inicial</label><input id="from" type="date" value="2026-07-01"></div><div class="field"><label>Fecha final</label><input id="to" type="date" value="2026-07-04"></div><div class="field"><label>Moneda</label><select id="currency"><option value="USA" selected>USD</option><option value="EUR">EUR</option><option value="MXC">MXC</option><option value="CAD">CAD</option><option value="REAL">REAL</option></select></div><button class="btn btn-blue filter-action" id="filterBtn">Filtrar</button></div></div></main>'+result+'</div>';}
async function loadSummary(doc){if(state.loading[doc.id])return;state.loading[doc.id]=true;render();const totals={USA:0,EUR:0,MXC:0,CAD:0,REAL:0};let ok=0;const queue=[...WORKER_SHEETS];async function worker(){while(queue.length){const sheet=queue.shift();try{const rows=await fetchSheetRows(doc,sheet);ok++;for(const row of rows){const code=String(row[1]||"").trim().toUpperCase();if(Object.prototype.hasOwnProperty.call(totals,code))totals[code]+=parseAmount(row[2]);}}catch(e){}}}await Promise.all(Array.from({length:Math.min(5,WORKER_SHEETS.length)},worker));Object.keys(totals).forEach(k=>totals[k]=Math.round((totals[k]+Number.EPSILON)*100)/100);state.summary[doc.id]=ok?{totals}:{totals,error:true};state.loading[doc.id]=false;render();}
function loadAllSummaries(){docs.forEach(loadSummary);}
async function doFilter(){const from=document.getElementById("from").value,to=document.getElementById("to").value,currency=document.getElementById("currency").value,sheet=document.getElementById("sheet").value;state.rows=null;if(!from||!to){alert("Selecciona las dos fechas.");return;}const f=new Date(from+"T00:00:00"),t=new Date(to+"T23:59:59");if(f>t){alert("La fecha inicial no puede ser posterior a la fecha final.");return;}const btn=document.getElementById("filterBtn");try{btn.disabled=true;btn.textContent="Consultando…";const rows=await fetchSheetRows(state.current,sheet);let inherited=null;const items=[];rows.forEach((row,index)=>{const detected=parseDateDMY(row[0]);if(detected)inherited=String(row[0]).trim();if(!inherited)return;const code=String(row[1]||"").trim().toUpperCase(),raw=row[2],name=String(row[3]||"").trim();if((raw==null||String(raw).trim()==="")&&!name)return;const d=parseDateDMY(inherited);if(!d||d<f||d>t||code!==currency)return;items.push({row:index+1,date:inherited,currency:code,amount:parseAmount(raw),name});});const total=items.reduce((s,x)=>s+x.amount,0);state.rows={sheet,currency,from,to,count:items.length,total:Math.round((total+Number.EPSILON)*100)/100,items};render();}catch(e){alert("No se pudo consultar el Spreadsheet. "+(e?.message||e));}finally{const b=document.getElementById("filterBtn");if(b){b.disabled=false;b.textContent="Filtrar";}}}
document.addEventListener("click",e=>{const t=e.target;if(t.id==="addBtn"||t.id==="emptyAddBtn"){state.modal=true;render();return;}if(t.id==="cancelBtn"||t.id==="cancelBtn2"){state.modal=false;render();return;}if(t.id==="modalBg"&&e.target===t){state.modal=false;render();return;}if(t.id==="saveBtn"){const name=document.getElementById("docName").value.trim(),url=document.getElementById("docUrl").value.trim();if(!name||!extractId(url)){alert("Escribe un nombre y un enlace válido de Google Sheets.");return;}const doc={id:"d"+Date.now(),name,url};docs.push(doc);save();state.modal=false;render();loadSummary(doc);return;}if(t.id==="backBtn"){state.screen="home";state.current=null;state.rows=null;render();return;}if(t.id==="filterBtn"){doFilter();return;}if(t.id==="closeResult"){state.rows=null;render();return;}if(t.id==="resultBg"&&e.target===t){state.rows=null;render();return;}const del=t.closest("[data-del]");if(del){e.stopPropagation();const id=del.dataset.del;docs=docs.filter(d=>d.id!==id);delete state.summary[id];delete state.loading[id];save();render();return;}const card=t.closest("[data-open]");if(card){state.current=docs.find(d=>d.id===card.dataset.open)||null;state.screen="detail";state.rows=null;render();}});
render();loadAllSummaries();
})();
</script>
</body>
</html>
